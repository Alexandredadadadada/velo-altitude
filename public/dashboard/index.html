<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISCO BOSS DU GAME - Login</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="login-container">
    <h1>DISCO BOSS DU GAME</h1>
    <form id="login-form">
      <label for="username">Login :</label>
      <input type="text" id="username" name="username" required autofocus>
      <label for="password">Mot de passe :</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Connexion</button>
      <div id="login-error" style="color:red;display:none;margin-top:10px;"></div>
    </form>
  </main>
  <script>
    const form = document.getElementById('login-form');
    form.onsubmit = function(e) {
      e.preventDefault();
      const username = form.username.value;
      const password = form.password.value;
      if(username === 'bossdisco' && password === 'findujeu555') {
        sessionStorage.setItem('isBossDisco', '1');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('login-error').style.display = 'block';
        document.getElementById('login-error').textContent = 'Identifiants invalides.';
      }
    };
  </script>
</body>
</html>
